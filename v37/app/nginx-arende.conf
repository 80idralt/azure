# nginx-site för Novatrix ärendeformulär (v37).
# Läggs som /etc/nginx/sites-available/default på webbservern.
# All trafik omdirigeras till HTTPS. Certifikatet skapas separat på
# servern (självsignerat, se README avsnitt 3) och committas aldrig.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    ssl_certificate     /etc/ssl/novatrix/novatrix.crt;
    ssl_certificate_key /etc/ssl/novatrix/novatrix.key;

    root /var/www/html;
    index index.html;

    # Höjer gränsen så en bildbilaga får plats (standard är 1 MB).
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ =404;
    }

    # Formuläret postar hit. nginx skickar det vidare till mottagaren
    # som äger den hanterade identiteten. Port 5000 nås aldrig utifrån.
    location = /submit {
        proxy_pass http://127.0.0.1:5000/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
